<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Avatar AI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            overflow: hidden;
            background: #f0f0f0;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #canvas-container {
            flex: 1;
            position: relative;
        }
        #controls {
            padding: 20px;
            background: white;
            border-top: 1px solid #ccc;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 0.8rem;
            color: #666;
        }
        select, button {
            padding: 8px 12px;
            cursor: pointer;
        }
        #status {
            margin-left: auto;
            font-weight: bold;
            color: #333;
        }
        #transcript {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            pointer-events: none;
            max-width: 80%;
            text-align: center;
            font-size: 1.2rem;
            min-width: 200px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="canvas-container">
            <div id="transcript">ここに喋った内容が表示されます</div>
        </div>
        <div id="controls">
            <div class="control-group">
                <label for="task-select">タスク</label>
                <select id="task-select">
                    <option value="cook_rice_1cup">ご飯を炊く (1合)</option>
                    <option value="connect_wires">電気配線の接続</option>
                </select>
            </div>
            <div class="control-group">
                <label for="character-select">性格</label>
                <select id="character-select">
                    <option value="gentle">優しい家庭教師</option>
                    <option value="strict">厳格な安全管理者</option>
                </select>
            </div>
            <div class="control-group">
                <label for="provider-select">プロバイダー</label>
                <select id="provider-select">
                    <option value="gemini">Google Gemini</option>
                    <option value="openai">OpenAI GPT-4</option>
                </select>
            </div>
            <button id="start-btn">音声認識開始</button>
            <div id="status">待機中</div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
