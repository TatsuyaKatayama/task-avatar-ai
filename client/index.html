<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Avatar AI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            overflow: hidden;
            background: #f0f0f0;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #canvas-container {
            flex: 1;
            position: relative;
        }
        #controls {
            padding: 20px;
            background: white;
            border-top: 1px solid #ccc;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #status {
            margin-left: auto;
            color: #666;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
        #transcript {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            pointer-events: none;
            max-width: 80%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="canvas-container">
            <div id="transcript">ここに喋った内容が表示されます</div>
        </div>
        <div id="controls">
            <button id="start-btn">音声認識開始</button>
            <div id="status">待機中</div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
